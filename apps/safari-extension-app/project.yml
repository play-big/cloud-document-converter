name: CloudDocumentConverter

options:
  bundleIdPrefix: com.dolphin
  deploymentTarget:
    macOS: '13.3'
  xcodeVersion: '15.0'
  generateEmptyDirectories: true

settings:
  base:
    PRODUCT_NAME: CloudDocumentConverter
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: '5.9'
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''

targets:
  CloudDocumentConverter:
    type: application
    platform: macOS
    sources:
      - path: CloudDocumentConverter
        excludes:
          - '**/.DS_Store'
    settings:
      base:
        INFOPLIST_FILE: CloudDocumentConverter/Info.plist
        CODE_SIGN_ENTITLEMENTS: CloudDocumentConverter/CloudDocumentConverter.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.dolphin.CloudDocumentConverter
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - target: CloudDocumentConverter Extension
        embed: true

  CloudDocumentConverter Extension:
    type: app-extension
    platform: macOS
    sources:
      - path: CloudDocumentConverter Extension
        excludes:
          - '**/.DS_Store'
    settings:
      base:
        INFOPLIST_FILE: CloudDocumentConverter Extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: CloudDocumentConverter Extension/CloudDocumentConverter Extension.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.dolphin.CloudDocumentConverter.Extension
        PRODUCT_MODULE_NAME: CloudDocumentConverterExtension
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - sdk: SafariServices.framework
